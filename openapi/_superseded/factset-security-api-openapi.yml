components:
  schemas:
    SMError:
      type: object
      properties:
        detail:
          type:
          - string
          - 'null'
          example: example_value
    sharesOutstandingRequestBody:
      title: Shares Outstanding Request Body
      description: Shares Outstanding Request Body
      type: object
      properties:
        ids:
          $ref: '#/components/schemas/idsBatchMax2000'
        startDate:
          $ref: '#/components/schemas/startDate'
        endDate:
          $ref: '#/components/schemas/endDate'
        frequency:
          $ref: '#/components/schemas/frequency'
        calendar:
          $ref: '#/components/schemas/calendar'
        batch:
          $ref: '#/components/schemas/batch'
      required:
      - ids
    OneOfSMFields:
      oneOf:
      - $ref: '#/components/schemas/SMBondFields'
      - $ref: '#/components/schemas/SMCustomCashFlowFields'
      discriminator:
        propertyName: securityType
        mapping:
          Bond: '#/components/schemas/SMBondFields'
          CCF: '#/components/schemas/SMCustomCashFlowFields'
    SMCreateParameters:
      required:
      - fields
      - securityName
      type: object
      properties:
        securityName:
          type: string
          example: example_value
        location:
          type:
          - string
          - 'null'
          example: example_value
        asofdate:
          type:
          - string
          - 'null'
          example: example_value
        fields:
          $ref: '#/components/schemas/OneOfSMFields'
    SMFields:
      required:
      - securityType
      type: object
      properties:
        securityType:
          enum:
          - Bond
          - CCF
          type: string
          example: Bond
    BatchStatusResponse:
      title: Batch Status Response
      type: object
      properties:
        data:
          $ref: '#/components/schemas/BatchStatus'
    SMCreateResponse:
      type: object
      properties:
        securityName:
          type:
          - string
          - 'null'
          example: example_value
        status:
          enum:
          - success
          - failure
          type: string
          example: success
        warnings:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SMWarning'
          example: []
        errors:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SMError'
          example: []
    BatchStatus:
      title: Batch Status
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: the id of batch request.
          example: abc123
        startTime:
          type: string
          format: date-time
          description: Time when the batch request is started. This is in Eastern Time Zone. The date-time format is expressed as [YYYY-MM-DD]T[HH:MM:SSS], following ISO 8601.
          example: '2026-01-15T10:30:00Z'
        endTime:
          type:
          - string
          - 'null'
          format: date-time
          description: Time when the batch request is ended. This is in Eastern Time Zone. The date-time format is expressed as [YYYY-MM-DD]T[HH:MM:SSS], following ISO 8601.
          example: '2026-01-15T10:30:00Z'
        status:
          type: string
          enum:
          - queued
          - executing
          - created
          - failed
          example: queued
        error:
          $ref: '#/components/schemas/batchErrorObject'
    sharesOutstandingResponse:
      type: object
      title: Shares Outstanding Response
      properties:
        data:
          description: Array of Shares Outstanding Objects
          type: array
          items:
            $ref: '#/components/schemas/sharesOutstandingResponseObject'
          example: []
    OneOfFieldsFields:
      oneOf:
      - $ref: '#/components/schemas/SMBondFields'
      - $ref: '#/components/schemas/SMCustomCashFlowFields'
      discriminator:
        propertyName: securityType
        mapping:
          Bond: '#/components/schemas/SMBondFields'
          CCF: '#/components/schemas/SMCustomCashFlowFields'
    batch:
      description: 'Enables the ability to asynchronously "batch" the request, supporting a long-running request for up to 20 minutes. Upon requesting batch=Y, the service will respond back with an HTTP Status Code of 202. Once a batch request is submitted, use batch status to see if the job has been completed. Once completed, retrieve the results of the request via batch-result. When using Batch, ids limit is increased to 10000 ids per request, though limits on query string via GET method still apply. It''s advised to submit large lists of ids via POST method. Please note that the number of unique currencies present in the requested ids is limited to 50 per request.

        '
      type: string
      enum:
      - Y
      - N
      default: N
    SMRetrieveParameters:
      required:
      - securityName
      type: object
      properties:
        securityName:
          type: string
          example: example_value
        location:
          type:
          - string
          - 'null'
          example: example_value
        asofdate:
          type:
          - string
          - 'null'
          example: example_value
        securityType:
          enum:
          - Bond
          - CCF
          type:
          - string
          - 'null'
          example: Bond
    calendar:
      title: Calendar
      type: string
      enum:
      - FIVEDAY
      - SEVENDAY
      - US
      default: FIVEDAY
      description: Calendar of data returned. SEVENDAY includes weekends.
      example: FIVEDAY
    SMDeleteParameters:
      required:
      - securityName
      type: object
      properties:
        securityName:
          type: string
          example: example_value
        location:
          type:
          - string
          - 'null'
          example: example_value
        asofdate:
          type:
          - string
          - 'null'
          example: example_value
        securityType:
          enum:
          - Bond
          - CCF
          type:
          - string
          - 'null'
          example: Bond
    SMRetrieveParametersRoot:
      required:
      - data
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SMRetrieveParameters'
          example: []
        meta:
          type:
          - object
          - 'null'
          example: example_value
    soErrorObject:
      type: object
      properties:
        id:
          description: A UUID for this particular occurrence of the problem.
          type: string
          example: adb01824-252f-4420-b0c6-35a1e3507ef5
        code:
          description: status
          type: string
          example: Bad Request
        links:
          description: The Endpoint path {package}/version/{endpoint}
          type: object
          properties:
            about:
              description: Details.
              type: string
              example: /factset-global-prices/v1/securtiy-shares
          example: example_value
        title:
          description: The plain text error message
          type: string
          example: Validation Error
    SMDeleteResponse:
      type: object
      properties:
        securityName:
          type:
          - string
          - 'null'
          example: example_value
        status:
          enum:
