components:
  schemas:
    StatusObject:
      type: object
      properties:
        code:
          type: number
          format: int32
          description: The HTTP status code of the response, mirroring the code from the Status-Line of the HTTP response message (see [RFC2616] section 6.1).
          example: 42.5
      description: The status member contains the status code of the response.
      required:
      - code
    OffsetBasedPaginationOutputObjectWithoutTotal:
      type: object
      description: Pagination attributes for the offset-based pagination strategy; a total element count is not supported.
      properties:
        hasNext:
          type: boolean
          description: Flag indicating that a subsequent request with the same parameters, except that the parameter `pagination.offset` is incremented by `pagination.limit`, would yield additional results.
          example: true
      required:
      - hasNext
      x-property-sort:
      - hasNext
    PostNewsPublisherSearchByNameRequest:
      x-property-sort:
      - data
      - meta
      description: Request Body
      required:
      - data
      type: object
      properties:
        data:
          type: object
          x-property-sort:
          - searchValue
          - matchType
          - filter
          description: The data member contains the request's primary data.
          properties:
            searchValue:
              type: string
              minLength: 2
              maxLength: 50
              description: Restricts the search to publishers, which match the search value. The comparison for a match is case sensitive.
            matchType:
              type: string
              description: The match type that is applied to the search.
              x-enum-description:
              - Publisher name must begin with the searchValue.
              - Publisher name must end with the searchValue.
              - Publisher name must begin, end, or contain the searchValue.
              enum:
              - begins
              - ends
              - contains
            filter:
              description: Criteria that filter the items in the response list; only items that match all of the criteria are returned.
              type: object
              x-property-sort:
              - distributor
              - delivery
              properties:
                distributor:
                  type: object
                  x-property-sort:
                  - id
                  description: Filter for distributors. See endpoint `/news/distributor/list` for valid values.
                  properties:
                    id:
                      type: number
                      format: id32
                      x-positive: true
                      description: Identifier of distributor.
                delivery:
                  type: object
                  x-property-sort:
                  - id
                  description: Filter for deliveries. See endpoint `/basic/delivery/list` for valid values.
                  properties:
                    id:
                      type: number
                      format: id32
                      x-positive: true
                      description: Identifier of delivery.
          required:
          - searchValue
          - matchType
        meta:
          type: object
          description: The meta member contains the meta information of the request.
          properties:
            attributes:
              $ref: '#/components/schemas/AttributesMember'
            sort:
              description: Sortable attributes. The sort order is ascending unless it is prefixed with a minus sign, in which case it is descending. A list of at most 1 (possibly prefixed) attribute name(s) is allowed.
              type: array
              items:
                type: string
                enum:
                - id
                - -id
                - name
                - -name
              maxItems: 1
              uniqueItems: true
              default:
              - name
          x-property-sort:
          - attributes
          - sort
    PostNewsArticleSearchByTextRequest:
      x-property-sort:
      - data
      - meta
      description: Request Body
      type: object
      properties:
        data:
          type: object
          x-property-sort:
          - text
          - criteria
          description: The data member contains the request's primary data.
          properties:
            text:
              description: Restrict the response of news articles to given include and exclude text criteria.
              type: object
              x-property-sort:
              - criteria
              properties:
                criteria:
                  description: ''
                  type: object
                  x-property-sort:
                  - selectionType
                  - phrases
                  - minimumMatchScore
                  - scope
                  properties:
                    selectionType:
                      description: Specify how the criteria should be applied to the search.
                      type: string
                      default: include
                      x-enum-description:
                      - Articles covering the given criteria are included in the result.
                      - Articles covering the given criteria are excluded from the result.
                      enum:
                      - include
                      - exclude
                    phrases:
                      description: Phrases to be used in the criteria.
                      type: array
                      items:
                        type: string
                        maxLength: 100
                      minItems: 1
                      maxItems: 16
                    minimumMatchScore:
                      type: number
                      format: real
                      default: 0.7
                      description: Minimum match score for words in the news article.
                    scope:
                      description: Restrict fulltext search to specific scope.
                      type: string
                      default: all
                      x-enum-description:
                      - Headline of the news article.
                      - Text body of the news article.
                      - Search in both headline and body.
                      enum:
                      - headline
                      - body
                      - all
            criteria:
              description: Restrict the response of news articles to given include and exclude criteria.
              type: array
              items:
                type: object
                x-property-sort:
                - selectionType
                - range
                - indices
                - instruments
                - types
