components:
  schemas:
    SubcommentSummaryDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: abc123
        userId:
          type: string
          format: uuid
          example: '500123'
        createdAt:
          type:
          - string
          - 'null'
          example: example_value
      additionalProperties: false
    AttachmentSummaryDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: abc123
        fileName:
          type:
          - string
          - 'null'
          example: example_value
        mimeType:
          type:
          - string
          - 'null'
          example: example_value
        size:
          type:
          - integer
          - 'null'
          format: int64
          example: 10
      additionalProperties: false
    NewItemDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: abc123
      additionalProperties: false
    CommentSummaryDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: abc123
        userId:
          type: string
          format: uuid
          example: '500123'
        createdAt:
          type:
          - string
          - 'null'
          example: example_value
        subcomments:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SubcommentSummaryDto'
          example: []
      additionalProperties: false
    OperationType:
      enum:
      - 0
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      type: integer
      format: int32
    CommentDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: abc123
        authorId:
          type: string
          format: uuid
          example: '500123'
        parentCommentId:
          type:
          - string
          - 'null'
          format: uuid
          example: '500123'
        body:
          type:
          - string
          - 'null'
          example: example_value
        createdAt:
          type:
          - string
          - 'null'
          example: example_value
        attachments:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/AttachmentSummaryDto'
          example: []
        subcomments:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SubcommentSummaryDto'
          example: []
      additionalProperties: false
    Operation:
      type: object
      properties:
        operationType:
