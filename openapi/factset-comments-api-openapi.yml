        path:
          type:
          - string
          - 'null'
          example: example_value
        op:
          type:
          - string
          - 'null'
          example: example_value
        from:
          type:
          - string
          - 'null'
          example: example_value
        value:
          example: example_value
      additionalProperties: false
    CreateCommentDto:
      type: object
      properties:
        authorId:
          type: string
          format: uuid
          example: '500123'
        parentCommentId:
          type:
          - string
          - 'null'
          format: uuid
          example: '500123'
        body:
          type:
          - string
          - 'null'
          example: example_value
      additionalProperties: false
    ProblemDetails:
      type: object
      properties:
        type:
          type:
          - string
          - 'null'
          example: example_value
        title:
          type:
          - string
          - 'null'
          example: Example Title
        status:
