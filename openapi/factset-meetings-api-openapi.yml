components:
  schemas:
    CreateBodyDto:
      type: object
      properties:
        content:
          type:
          - string
          - 'null'
          example: example_value
      additionalProperties: false
    AttendeeDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: abc123
        emailAddress:
          type:
          - string
          - 'null'
          example: user@example.com
        fullName:
          type:
          - string
          - 'null'
          example: example_value
      additionalProperties: false
    NewItemDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: abc123
      additionalProperties: false
    LocationDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: abc123
        locationName:
          type:
          - string
          - 'null'
          example: example_value
      additionalProperties: false
    MeetingDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: abc123
        start:
          type:
          - string
          - 'null'
          example: example_value
        end:
          type:
          - string
          - 'null'
          example: example_value
        createdAt:
          type:
          - string
          - 'null'
          example: example_value
        authorId:
          type: string
          format: uuid
          example: '500123'
        title:
          type:
          - string
          - 'null'
          example: Example Title
        identifier:
          type:
          - string
          - 'null'
          example: example_value
        organizer:
          type:
          - string
          - 'null'
          deprecated: true
          example: example_value
        organizerId:
          type: string
          format: uuid
          example: '500123'
        body:
          type:
          - string
          - 'null'
          example: example_value
        averageRating:
          type:
          - integer
          - 'null'
          format: int32
          example: 10
        alertAttendees:
          type: boolean
          example: true
        alertAuthor:
          type: boolean
          example: true
        locations:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/LocationDto'
          example: []
        attendees:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/AttendeeDto'
          example: []
        customFields:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/CustomFieldValueDto'
          example: []
        relatedSymbols:
          type:
          - array
