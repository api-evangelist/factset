                          type:
                          - string
                          - 'null'
                          description: International Securities Identification Number of the instrument.
                        nsin:
                          type: object
                          x-property-sort:
                          - wkn
                          - valor
                          - cusip
                          description: NSIN data of the instrument.
                          properties:
                            wkn:
                              type:
                              - string
