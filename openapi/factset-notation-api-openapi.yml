                    - allEntitled
                    - isin
                    - wkn
                    - valor
                    - sedol
                    - cusip
                    - symbol
                    - normalizedSymbol
                    - longName
                    - shortName
                  uniqueItems: true
                  maxItems: 8
                  default:
