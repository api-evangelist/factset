          - 'null'
          format: date-time
          example: '2026-01-15T10:30:00Z'
        comment:
          type:
          - string
          - 'null'
          example: example_value
        isCurrent:
          type: boolean
          example: true
        symbol:
          type:
          - string
          - 'null'
          example: example_value
        title:
          type:
          - string
          - 'null'
