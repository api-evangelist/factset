          $ref: '#/components/schemas/optimizer.inputs.QuantRiskRequestInfo'
      required: []
    optimizer.inputs.Portfolios:
      type: object
      properties:
        initial:
          $ref: '#/components/schemas/optimizer.inputs.Portfolio'
        benchmarks:
          type: array
