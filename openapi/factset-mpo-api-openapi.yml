          $ref: '#/components/schemas/optimizer.inputs.RawRiskModel'
      required: []
    optimizer.inputs.QuantRiskModel:
      type: object
      properties:
        raw_data:
          $ref: '#/components/schemas/optimizer.inputs.QuantRiskModelRawData'
