    fundsPricesRequest:
      title: Prices Request Body
      description: Prices Request Body
      type: object
      properties:
        ids:
          $ref: '#/components/schemas/ids'
        startDate:
          $ref: '#/components/schemas/startDate'
        endDate:
          $ref: '#/components/schemas/endDate'
        frequency:
          $ref: '#/components/schemas/frequency'
        currency:
          $ref: '#/components/schemas/currency'
        dataType:
          $ref: '#/components/schemas/dataType'
        splitAdjust:
          $ref: '#/components/schemas/splitAdjust'
      required:
      - ids
    startDate:
      type: string
      description: 'The start date requested for a given date range in **YYYY-MM-DD** format. If left blank, the API will default to previous close. Future dates (T+1) are not accepted in this #endpoint.

        '
      example: '2019-01-01'
    frequency:
      type: string
      enum:
      - D
      - W
      - M
      - AM
      - CQ
      - FQ
      - AY
      - CY
      - FY
      default: D
      description: "Controls the display frequency of the data returned.\n  * **D** = Daily\n  * **W** = Weekly, based on the last day of the week of the start date.\n  * **M** = Monthly, based on the last trading day of the month.\n  * **AM** = Monthly, based on the start date (e.g., if the start date is June 16, data is displayed for June 16, May 16, April 16 etc.).\n  * **CQ** = Quarterly based on the last trading day of the calendar quarter (March, June, September, or December).\n  * **FQ** = Fiscal Quarter of the company.\n  * **AY** = Actual Annual, based on the start date.\n  * **CY** = Calendar Annual, based on the last trading day of the calendar year.\n  * **FY** = Fiscal Annual, based on the last trading day of the company's fiscal year.\n"
      example: M
    prices:
      title: Prices Object
      type: object
      properties:
        fsymId:
          description: FactSet Security Identifier. Six alpha-numeric characters, excluding vowels, with a -S suffix (XXXXXX-S), resolved from the requestId of the Fund requested.
          type:
          - string
          - 'null'
          example: FNK7XP-S
          x-fds-fql-formula: FSYM_SECURITY_PERM_ID('SECURITY')
        price:
          description: The NAV for the requested share class. NOTE - FactSet Mutual Funds does not use seven-day yields to price money market funds.
          type:
          - number
          - 'null'
          format: double
          example: 19.94
          x-fds-fql-formula: FFD_PRICE
        date:
          description: The date of the NAV in YYYY-MM-DD format.
          type:
          - string
          - 'null'
          format: date
          example: '2021-02-26'
        requestId:
          description: The requested Id sent as input.
          type: string
          example: MABAX
        currency:
          description: ISO3 Currency
          type:
          - string
          - 'null'
          example: USD
    ids:
      type: array
      items:
        type: string
      minItems: 1
      maxItems: 1000
      description: 'The requested Fund Identifier. FactSet Identifiers, tickers, CUSIP and SEDOL are accepted input. <p>***ids limit** =  1000 per request*</p> *<p>Make note, GET Method URL request lines are also limited to a total length of 8192 bytes (8KB). In cases where the service allows for thousands of ids, which may lead to exceeding this request line limit of 8KB, its advised for any requests with large request lines to be requested through the respective "POST" method.</p>*

        '
      example:
      - MABAX
      - FCNTX
    fundsPricesResponse:
      type: object
      title: Prices Response
      properties:
        data:
          description: Array of Prices Objects
          type: array
          items:
            $ref: '#/components/schemas/prices'
          example: []
    dataType:
      type: string
      enum:
      - ROLL
      - RAW
      default: RAW
      description: 'Controls the data type of the Fund NAV between Raw or Rolled values.

        '
      example: ROLL
    splitAdjust:
      type: string
      enum:
      - SPLIT
      - UNSPLIT
      default: SPLIT
      description: "Controls the split adjustment of the Fund's NAV - \n  * **SPLIT** = Split ONLY Adjusted. This is used by default.\n  * **UNSPLIT** = No Adjustments, Controls the split and dividend adjustments for the prices.\n"
      example: SPLIT
    endDate:
      type: string
      description: 'The end date requested for a given date range in **YYYY-MM-DD** format. If left blank, the API will default to previous close. Future dates (T+1) are not accepted in this endpoint.

        '
      example: '2019-12-31'
    currency:
      type: string
      description: The ISO3 currency control for the requested fund.
      default: LOCAL
      example: USD
