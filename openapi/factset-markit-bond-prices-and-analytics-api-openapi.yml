components:
  schemas:
    bondMetaResponse:
      type: object
      title: Bond Meta Response
      description: Array of Bond Meta Response Objects
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/bondMeta'
    absDetails:
      title: ABS Details Response Object
      type: object
      properties:
        requestId:
          description: Identifier that was used for the request.
          type: string
          example: US05522RDC97
        fsymId:
          description: FactSet Regional Security Identifier. Six alpha-numeric characters, excluding vowels, with an -R suffix (XXXXXX-R). Identifies the security's best regional security data series per currency. For equities, all primary listings per region and currency are allocated a regional-level permanent identifier. The regional-level permanent identifier will be available once a SEDOL representing the region/currency has been allocated and the identifiers are on FactSet.
          type:
          - string
          - 'null'
          example: V1D5YM-S
        date:
          description: The date on which the price is calculated.
          type:
          - string
          - 'null'
          format: date
          example: '2023-01-26'
        cdr:
          description: A vector of conditional default rate assumption used in the evaluated price of the instrument. CDR represents the percentage of outstanding principal balances in the pool that are in default.
          type:
          - string
          - 'null'
          example: '0'
        cpr:
          description: Returns the flat CPR that would equate to the same weighted average life (WAL) projection for Agency CMOs as the base case CPR vector
          type:
          - number
          - 'null'
          format: double
          example: null
        factor:
          description: The representation of the amount of the principal of an amortizing bond that has been paid out or written down since issuance, expressed as a percentage of the original total principal
          type:
          - number
          - 'null'
          format: double
          example: 1
        estimatedFactor:
          description: The projected agency pool factor between factor date and the day the actual factor is reported to investors (only applicable for agency passthrough securities).
          type:
          - number
          - 'null'
          format: double
          example: null
        bidPricePreFactor:
          description: Returns the agency pool bid price that is adjusted to account for prepayment expectations during the first five business days of the month before the factors are reported.
          type:
          - number
          - 'null'
          format: double
          example: null
        midPricePreFactor:
          description: Returns the agency pool mid price that is adjusted to account for prepayment expectations during the first five business days of the month before the factors are reported.
          type:
          - number
          - 'null'
          format: double
          example: null
        askPricePreFactor:
          description: Returns the agency pool ask price that is adjusted to account for prepayment expectations during the first five business days of the month before the factors are reported.
          type:
          - number
          - 'null'
          format: double
          example: null
        CPREstimatePreFactor:
          description: Returns the agency pool CPR estimate that is adjusted to account for prepayment expectations during the first five business days of the month before the factors are reported.
          type:
          - number
          - 'null'
          format: double
          example: null
        liquidity:
          description: Returns the market liquidity score.
          type:
          - number
          - 'null'
          format: double
          example: 1
        payUp:
          description: Returns the number of ticks, in 32nds format, above the TBA price.
          type:
          - number
          - 'null'
          format: double
          example: null
        payUpDescription:
          description: Returns the specified pool characteristics being used to drive the pay-up.
          type:
          - string
          - 'null'
          example: null
        prePayRate:
          description: '''Returns a vector of values of speed used in the evaluated price of the instrument. It is the estimated rate at which borrowers pays off the obligations that underlies an instrument.'
          type:
          - number
          - 'null'
          format: double
          example: 20
        prePayType:
          description: Returns the type of prepayment speed used in the evaluated price of the instrument.
          type:
          - string
          - 'null'
          example: SMM
        severity:
          description: Returns a vector of Loss Severity assumption used in evaluated price of the instrument. It is the percentage of the principal applied to the defaulted loan balance.
          type:
          - number
          - 'null'
          format: double
          example: 0
        wal:
          description: Returns the Weighted Average Life of the instrument.
          type:
          - number
          - 'null'
          format: double
          example: 0.886
        WALPrincipal:
          description: Returns the Weighted Average Life of the instrument.
          type:
          - number
          - 'null'
          format: double
          example: 0.886
    bondSpreadResponse:
      type: object
      title: Bond Spread Response
      description: Array of Bond Spread Response Objects
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/bondSpread'
    bondCoupon:
      title: Bond Coupon Response Object
      type: object
      properties:
        requestId:
          description: Identifier that was used for the request.
          type: string
          example: US45905URL07
        fsymId:
          description: FactSet Regional Security Identifier. Six alpha-numeric characters, excluding vowels, with an -R suffix (XXXXXX-R). Identifies the security's best regional security data series per currency. For equities, all primary listings per region and currency are allocated a regional-level permanent identifier. The regional-level permanent identifier will be available once a SEDOL representing the region/currency has been allocated and the identifiers are on FactSet.
          type:
          - string
          - 'null'
          example: CJQZQ0-S
        date:
          description: The date on which the price is calculated.
          type:
          - string
          - 'null'
          format: date
          example: '2023-01-26'
        accruedInterest:
          description: The interest that is owed, but not yet paid, added to the price of the bond. Available only for `corporate and municipal bonds`.
          type:
          - number
          - 'null'
          format: double
          example: 0.86771
        coupon:
          description: The current coupon rate of the instrument. Available only for `corporate and municipal bonds`.
          type:
          - number
          - 'null'
          format: double
          example: 2.125
        couponType:
          description: The coupon type of the instrument. Available only for `corporate and municipal bonds`.
          type:
          - string
          - 'null'
          example: Fixed
        couponFrequency:
          description: 'The coupon frequency of the bond. Available only for `corporate bonds`. '
          type:
          - string
          - 'null'
          example: 6M
    bondPrices:
      title: Bond Prices Response Object
      type: object
      properties:
        requestId:
          description: Identifier that was used for the request.
          type: string
          example: US45905URL07
        fsymId:
          description: FactSet Regional Security Identifier. Six alpha-numeric characters, excluding vowels, with an -R suffix (XXXXXX-R). Identifies the security's best regional security data series per currency. For equities, all primary listings per region and currency are allocated a regional-level permanent identifier. The regional-level permanent identifier will be available once a SEDOL representing the region/currency has been allocated and the identifiers are on FactSet.
          type:
          - string
          - 'null'
          example: CJQZQ0-S
        currency:
          description: Returns the coupon currency .Available only  available for `corporate and asset-backed security bonds`.
          type:
          - string
          - 'null'
          example: USD
        date:
          description: The date on which the price is calculated.
          type:
          - string
          - 'null'
          format: date
          example: '2023-01-26'
        cleanBidPrice:
          description: The bid price of the instrument.
          type:
          - number
          - 'null'
          format: double
          example: 95.74477
        cleanMidPrice:
          description: The bid price of the instrument.
          type:
          - number
          - 'null'
          format: double
          example: 95.77036
        cleanAskPrice:
          description: The bid price of the instrument.
          type:
          - number
          - 'null'
          format: double
          example: 95.79596
        dirtyBidPrice:
          description: The price of the bond plus the interest that is accrued between coupon payments, based on the bid price. Available only  for `corporate bonds`.
          type:
          - number
