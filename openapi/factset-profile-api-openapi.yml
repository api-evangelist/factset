                  type: array
                  items:
                    type: string
                note:
                  type: string
            crunchbaseUrl:
              type: object
              required:
              - value
              - note
              properties:
                value:
                  type: string
                note:
                  type: string
        contact:
          type: object
          required:
          - address
          - city
          - phone
          - stateProvince
          - zip
          - country
          - website
          - email
          properties:
            address:
              type: object
              required:
              - value
              properties:
                value:
                  type:
                  - string
                  - 'null'
            city:
              type: object
              required:
              - value
              properties:
                value:
                  type:
                  - string
                  - 'null'
            phone:
              type: object
              required:
              - value
              properties:
                value:
                  type:
                  - string
                  - 'null'
            stateProvince:
              type: object
              required:
              - value
              properties:
                value:
                  type:
                  - string
                  - 'null'
            zip:
              type: object
              required:
              - value
              properties:
                value:
                  type:
                  - string
                  - 'null'
            country:
              type: object
              required:
              - value
              properties:
                value:
                  type:
                  - string
                  - 'null'
            website:
              type: object
              required:
              - value
              properties:
                value:
                  type:
                  - string
                  - 'null'
            email:
              type: object
              required:
              - value
              properties:
                value:
                  type:
                  - string
                  - 'null'
            people:
              type: array
              items:
                type: object
                required:
                - title
                - name
                - id
                properties:
                  title:
                    type: object
                    required:
                    - value
                    properties:
                      value:
                        type:
                        - string
                        - 'null'
                  name:
                    type: object
                    required:
                    - value
                    properties:
                      value:
                        type:
                        - string
                        - 'null'
                  id:
                    type: object
                    required:
                    - value
                    properties:
                      value:
                        type:
                        - string
                        - 'null'
        size:
