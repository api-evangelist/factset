                value: null
            pevcBacking:
              value: null
          meta:
            sources:
              value:
              - FactSet Fundamentals
              - FactSet RBICS
              - Crunchbase
        meta:
          requestId: FDS
          fsymId: SQFMK3-R
    idRequiredParameterError:
      summary: generic parameter error (missing parameter)
      value:
        errors:
        - id: 39314614-e607-465a-ba95-5bb79c362e23
          code: parameterError
          title: 'Missing required parameter(s): ''id'''
    idInvalidParameterError:
      summary: generic parameter error (invalid parameter)
      value:
        errors:
        - id: 39314614-e607-465a-ba95-5bb79c362e23
          code: parameterError
          title: 'Invalid parameter(s): ''id'''
    parameterErrorView:
      summary: view parameter error
      value:
        errors:
        - id: 3838f112-ed5a-4d9d-b0c7-3594d8eab0ed
          code: parameterError
          title: 'Invalid parameter: ''view''. Accepted values include: ''FINANCIAL'', ''VALUATION'', ''CAPITALIZATION'', ''MARGINS'' or ''PERFORMANCE'''
    parameterErrorTopn:
      summary: topn parameter error
      value:
        errors:
        - id: 39314614-e607-465a-ba95-5bb79c362e23
          code: parameterError
          title: 'Invalid parameter: ''topn'''
  schemas:
    DataPointMeta:
      type: object
      anyOf:
      - properties:
          currencyCode:
            type: string
            description: Code for data currency
          currencySymbol:
            type: string
            description: Symbol for data currency
          scale:
            type: integer
            description: 'Integer power of 10 to which numbers have been scaled. For example: 6 implies millions.

              Default is 0.

              '
    ProfileData:
      type: object
      required:
      - business
      - contact
      - size
      - stage
      properties:
        business:
          type: object
          required:
          - description
          - industry
          - name
          - sector
          properties:
            description:
              type: object
              required:
              - value
              properties:
                value:
                  type:
                  - string
                  - 'null'
                note:
                  type: string
            industry:
              type: object
              required:
              - value
              properties:
                value:
                  type:
                  - string
                  - 'null'
            sector:
              type: object
              required:
              - value
              properties:
                value:
                  type:
                  - string
                  - 'null'
            name:
              type: object
              required:
              - value
              properties:
                value:
                  type:
                  - string
                  - 'null'
            dbaName:
              type: object
              required:
              - value
              properties:
                value:
                  type:
                  - string
                  - 'null'
            crunchbaseCategories:
              type: object
