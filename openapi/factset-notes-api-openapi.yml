openapi: 3.2.0
info:
  title: Factset Notes API
  version: '1'
  description: 'Operations tagged Notes across 2 of this provider''s published API definitions: factset-irn-notes-api-openapi.yml, irn-notes-openapi-original.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.factset.com/research/irn
  description: Production Server
- url: https://api-sandbox.factset.com/research/irn
  description: Sandbox
security:
- FactSetApiKey: []
- FactSetOAuth2: []
tags:
- name: Notes
paths:
  /v1/notes:
    get:
      tags:
      - Notes
      summary: Factset Get All the Notes in the Specified Date Range Filtered on the Given Identifiers
      operationId: GetNotes
      parameters:
      - name: start
        in: query
        description: StartDate
        schema:
          type: string
      - name: end
        in: query
        description: EndDate
        schema:
          type: string
      - name: identifiers
        in: query
        description: Set of identifiers to filter on
        schema:
          type: array
          items:
            type: string
      - name: authors
        in: query
        description: Set of authors to filter on
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: subjects
        in: query
        description: Set of subjects to filter on
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: recommendations
        in: query
        description: Set of recommendations to filter on
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: sentiments
        in: query
        description: Set of sentiments to filter on
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: limit
        in: query
        description: Limit on the number of notes retrieved
        schema:
          type: integer
          format: int32
      - name: offset
        in: query
        description: Fetch notes after the offset
        schema:
          type: integer
          format: int32
      - name: modifiedSince
        in: query
        description: Only return notes which have been modified or created since a particular time
        schema:
          type: string
      - name: states
        in: query
        description: Set of states to filter on
        schema:
          type: array
          items:
            type: string
      - name: filterOnRelatedSymbols
        in: query
        description: Include notes whose related symbols match the identifier filter
        schema:
          type: boolean
          default: false
      - name: includeRelatedEntities
        in: query
        description: When set to true fetches notes tagged with all the entities related to identifiers param
        schema:
          type: boolean
          default: false
      - name: X-IRN-Include-Deleted
        in: header
        description: ''
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NoteSummaryDto'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
    post:
      tags:
      - Notes
      summary: Factset Create a Note
      operationId: CreateNote
      parameters:
      - name: X-IRN-Contributor-Username
        in: header
        schema:
          maxLength: 30
          minLength: 0
          type: string
      - name: X-IRN-Contributor-Serial
        in: header
        schema:
          maxLength: 8
          minLength: 0
          type: string
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/CreateNoteDto'
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNoteDto'
          text/json:
            schema:
              $ref: '#/components/schemas/CreateNoteDto'
          application/*+json:
            schema:
              $ref: '#/components/schemas/CreateNoteDto'
        required: true
      responses:
        '201':
          description: Success - Returns unique identifier of the note created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewItemDto'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
    servers:
    - url: https://api.factset.com/research/irn
      description: Production Server
    - url: https://api-sandbox.factset.com/research/irn
      description: Sandbox
  /v1/notes/{noteId}:
    get:
      tags:
      - Notes
      summary: Factset Get Details of a Note
      operationId: GetNote
      parameters:
      - name: noteId
        in: path
        description: Note Id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteDto'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
    put:
      tags:
      - Notes
      summary: Factset Update a Note
      operationId: UpdateNote
      parameters:
      - name: noteId
        in: path
        description: Note Id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: Note details to update
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/UpdateNoteDto'
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNoteDto'
          text/json:
            schema:
              $ref: '#/components/schemas/UpdateNoteDto'
          application/*+json:
            schema:
              $ref: '#/components/schemas/UpdateNoteDto'
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
    delete:
      tags:
      - Notes
      summary: Factset Delete a Note
      operationId: DeleteNote
      parameters:
      - name: noteId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
    servers:
    - url: https://api.factset.com/research/irn
      description: Production Server
    - url: https://api-sandbox.factset.com/research/irn
      description: Sandbox
