    - url: https://api-sandbox.factset.com/research/irn
      description: Sandbox
components:
  schemas:
    CreateBodyDto:
      type: object
      properties:
        content:
          type:
          - string
          - 'null'
          example: example_value
      additionalProperties: false
    NewItemDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: abc123
      additionalProperties: false
    NoteEventDto:
      type: object
      properties:
        createdAt:
          type:
          - string
          - 'null'
          example: example_value
        type:
          type:
          - string
          - 'null'
          example: example_value
        user:
          type:
          - string
          - 'null'
          example: example_value
        comment:
          type:
          - string
          - 'null'
          example: example_value
        changeList:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/RecordChangeDto'
          example: []
      additionalProperties: false
    CreateCustomFieldValueDto:
      required:
      - code
      type: object
      properties:
        code:
          type: string
          example: example_value
        integerValue:
          type:
          - integer
          - 'null'
          format: int32
          example: 10
        textValue:
          type:
          - string
          - 'null'
          example: example_value
        filePathValue:
          type:
          - string
          - 'null'
          example: example_value
        numericValue:
          type:
          - number
          - 'null'
          format: double
          example: 42.5
        dateValue:
          type:
          - string
          - 'null'
          example: example_value
        extendedTextValue:
          type:
          - string
          - 'null'
          example: example_value
        contactLookupValues:
          type:
          - array
          - 'null'
          items:
            type: string
            format: uuid
          example: []
        optionValue:
          type:
