          type: integer
          format: int32
          example: 10
        totalPages:
          type: integer
          format: int32
          example: 10
        totalCalculations:
          type: integer
          format: int32
          example: 10
        nextPage:
          type:
          - string
          - 'null'
          example: example_value
        previousPage:
          type:
          - string
          - 'null'
          example: example_value
