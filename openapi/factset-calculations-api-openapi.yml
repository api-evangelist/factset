components:
  schemas:
    QuantScreeningExpression:
      required:
      - expr
      - name
      type: object
      allOf:
      - $ref: '#/components/schemas/QuantFormula'
      properties:
        expr:
          type: string
          example: example_value
        name:
          type: string
          example: Example Title
        dateOffset:
          type:
          - string
          - 'null'
          example: example_value
    CalculationsSummaryRoot:
      required:
      - data
