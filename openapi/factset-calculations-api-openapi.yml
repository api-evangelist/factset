      allOf:
      - $ref: '#/components/schemas/QuantFormula'
      properties:
        referenceName:
          type: string
          example: example_value
        name:
          type: string
          example: Example Title
    CalculationStatusRoot:
      required:
      - data
      type: object
      properties:
        data:
          $ref: '#/components/schemas/CalculationStatus'
        meta:
          $ref: '#/components/schemas/CalculationStatusMeta'
    QuantAllUniversalScreenParameters:
      type: object
      allOf:
      - $ref: '#/components/schemas/QuantFormula'
    OneOfQuantDates:
      oneOf:
      - $ref: '#/components/schemas/QuantFdsDate'
      - $ref: '#/components/schemas/QuantDateList'
      discriminator:
        propertyName: source
        mapping:
          FdsDate: '#/components/schemas/QuantFdsDate'
          DateList: '#/components/schemas/QuantDateList'
    QuantDate:
      required:
      - calendar
      - frequency
      - source
      type: object
      properties:
        source:
          enum:
          - FdsDate
          - DateList
          type: string
          example: FdsDate
        frequency:
          type: string
          example: example_value
        calendar:
          type: string
          example: example_value
        overrideUniversalScreenCalendar:
          type:
          - boolean
          - 'null'
          example: true
    CalculationUnitStatusMeta:
      type: object
      properties:
        info:
          type:
          - string
          - 'null'
          description: The Info URL of the calculation.
          example: example_value
    QuantFormula:
      required:
      - source
      type: object
      properties:
        source:
          enum:
          - ScreeningExpression
          - FqlExpression
          - UniversalScreenParameter
          - AllUniversalScreenParameters
          type: string
          example: ScreeningExpression
    PaginationMeta:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/PaginationInfo'
    QuantUniversalScreenUniverse:
      required:
      - screen
      type: object
      allOf:
      - $ref: '#/components/schemas/QuantUniverse'
      properties:
        screen:
          type: string
          example: example_value
    CalculationStatusMeta:
      type: object
      properties:
        units:
          type:
          - object
          - 'null'
          additionalProperties:
            $ref: '#/components/schemas/CalculationUnitStatusMeta'
          description: Meta of calculation units in batch.
          example: example_value
    ClientErrorResponse:
      type: object
      properties:
        errors:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Error'
          example: []
    QuantFdsDate:
      required:
      - endDate
      - startDate
      type: object
      allOf:
      - $ref: '#/components/schemas/QuantDate'
      properties:
        startDate:
          type: string
          example: example_value
        endDate:
          type: string
          example: example_value
    QuantIdentifierUniverse:
